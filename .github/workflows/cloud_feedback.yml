name: cloud feedback
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: cloud-brain
  cancel-in-progress: false
jobs:
  sync:
    if: contains(github.event.issue.labels.*.name, 'feedback') && !contains(github.event.issue.labels.*.name, 'processed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import feedback into cloud DB
        run: python cloud_feedback.py
      - name: Commit DB
        run: |
          git config user.name "open-net-brain[bot]"
          git config user.email "open-net-brain@users.noreply.github.com"
          git add docs/cloud_brain.db
          git diff --cached --quiet && exit 0
          git commit -m "cloud brain: import feedback [skip ci]"
          git pull --rebase
          git push
      - name: Mark processed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels \
            -d '{"labels":["processed"]}' >/dev/null
